// ToyCity protocol v0: the wire format between server and front ends, and the save format.
// Cell arrays are row-major: index = y * width + x.
syntax = "proto3";

package toycity.v0;

option csharp_namespace = "ToyCity.Protocol.V0";

// ---------------------------------------------------------------------------
// Client -> server
// ---------------------------------------------------------------------------

message ClientMessage {
  uint32 seq = 1;
  oneof body {
    Hello hello = 2;
    Action action = 3;
    WhyRequest why = 4;
    OverlayRequest overlay = 5;
    InspectRequest inspect = 6;
    SaveRequest save = 7;
    LoadRequest load = 8;
    NewCityRequest new_city = 9;
    SetSpeed speed = 10;
    DemandRequest demand = 11;
    ForecastRequest forecast = 12;
    EncyclopediaRequest encyclopedia = 13;
    OrdinancesRequest ordinances = 14;
    AdvisorsRequest advisors = 15;
    SignIn sign_in = 16;
    FoundCity found_city = 17;
    NewRegionRequest new_region = 18;
    RegionRequest region = 19;
    GoToCity go_to = 20;
    DealRequest deal = 21;
    MayorRequest mayor = 22;
  }
}

message Hello {
  string client_name = 1;
  uint32 protocol_version = 2;
}

// Signs in to a server that asks for it (Welcome.sign_in_required): with a name and password, creating the account
// if create is set, or with a token from an earlier SignedIn. The server answers SignedIn or an Error.
message SignIn {
  string name = 1;
  string password = 2;
  bool create = 3;
  string invite_code = 4;  // for a server that joins by invite
  string token = 5;
}

message Rect {
  int32 x0 = 1;
  int32 y0 = 2;
  int32 x1 = 3;
  int32 y1 = 4;
}

message Action {
  oneof kind {
    PlacePath path = 1;
    PaintZone zone = 2;
    PlaceBuilding building = 3;
    Bulldoze bulldoze = 4;
    Terraform terraform = 5;
    SetTax tax = 6;
    SetFunding funding = 7;
    TakeLoan loan = 8;
    PlaceUtility utility = 9;
    SetOrdinance ordinance = 10;
    RespondPrompt respond = 11;
    TriggerDisaster disaster = 12;
    SetDisasters disasters = 13;
    ZoneBlock block = 14;
    SideGameCommand side_game = 15;
    AttachSideGame attach = 16;
    SetSeat seat = 17;
    LeaseLot lease = 18;
    SetLeaseTerms lease_terms = 19;
    EndLease end_lease = 20;
    SetConsent consent = 21;
    UpgradeBuilding upgrade = 22;
    SetAwayLevel away_level = 23;
    SetCityRule city_rule = 24;
    Pact pact = 25;
    SetDeputy deputy = 26;
    SetCouncil council = 27;
    Vote vote = 28;
    OfferLease offer = 29;
    AnswerOffer answer_offer = 30;
    Delink delink = 31;
    OpenTender open_tender = 32;
  }
}

enum OfferKind {
  OFFER_TERMS = 0;     // new lease terms, starting as soon as they're accepted
  OFFER_BUYOUT = 1;    // the city pays the operator amount to end the lease
  OFFER_RELOCATE = 2;  // the lease moves to to_building_id, the city paying amount toward the move
}

// One side of a lease offers the other a deal. from_operator says which side the sender speaks for. A counter-offer
// names the open offer it answers.
message OfferLease {
  int32 lease_id = 1;
  bool from_operator = 2;
  OfferKind kind = 3;
  LeaseTerms terms = 4;
  int64 amount = 5;
  int32 to_building_id = 6;
  int32 counter_of = 7;
}

// A player leaves the city for good, taking a copy of it; or the mayor cuts them loose when the rules allow.
message Delink {
  string player = 1;
}

// The mayor (or a deputy for transit) puts a district's transit franchise out to tender, for 6 to 36 months.
message OpenTender {
  int32 district = 1;
  int32 months = 2;
}

// The other side accepts or declines an offer; its maker declining it withdraws it.
message AnswerOffer {
  int32 offer_id = 1;
  bool accept = 2;
}

// The mayor makes a player a deputy (portfolio bits as in Deputy), or stands them down with 0.
message SetDeputy {
  string player = 1;
  uint32 portfolios = 2;
}

message SetCouncil {
  bool on = 1;
}

message Vote {
  int32 proposal = 1;
  bool yes = 2;
}

// The city's owner forbids a mechanic here whatever the players allow, or lifts that.
message SetCityRule {
  Mechanic mechanic = 1;
  bool forbid = 2;
}

// A pact between the sender and one other player on a mechanic between the two of them.
message Pact {
  enum Step {
    PACT_OFFER = 0;
    PACT_ACCEPT = 1;
    PACT_END = 2;   // ends a pact, or withdraws or turns down an offer
  }
  Step step = 1;
  string with = 2;  // the other player
  Mechanic mechanic = 3;
}

// How the computer plays a seat while its owner is away from a dedicated server (not manual).
message SetAwayLevel {
  string seat = 1;
  SeatLevel level = 2;
  AutopilotStyle style = 3;
}

enum Mechanic {
  MECH_BRIBERY = 0;
  MECH_EXCLUSIVE_RIGHTS = 1;
  MECH_SABOTAGE = 2;
  MECH_HOSTILE_EVICTIONS = 3;
  MECH_ABSURD_DISASTERS = 4;
  MECH_TARGETED_CRIME = 5;
  MECH_CROOKED_SERVICES = 6;  // the emergency services may slow-walk, run rackets, look away, start fires, strike
}

// A player switches a mechanic on or off for themselves. It is on in the city only while every seat owner allows it.
message SetConsent {
  string owner = 1;
  Mechanic mechanic = 2;
  bool allowed = 3;
}

enum LeaseMode {
  LEASE_BUSINESS = 0;        // the operator pays rent and a fare tax and keeps the profit
  LEASE_PUBLIC_SERVICE = 1;  // the city pays a subsidy and caps fares
}

message LeaseTerms {
  LeaseMode mode = 1;
  int64 rent_per_month = 2;
  int32 tax_tenths = 3;  // fare tax, tenths of a percent
  int64 subsidy_per_month = 4;
  int32 fare_cap_cents = 5;  // 0 = free to ride
  int32 notice_months = 6;
}

// The mayor leases a lot (a bus stop or depot) to a side game. No terms: the city's standard ones.
message LeaseLot {
  string game = 1;
  int32 building_id = 2;
  LeaseTerms terms = 3;
}

// New terms for a lease, starting after the current terms' notice period.
message SetLeaseTerms {
  int32 lease_id = 1;
  LeaseTerms terms = 2;
}

// The operator gives up a lease, or the mayor ends one past its cure period (or, with hostile evictions on, any
// lease after notice and with compensation).
message EndLease {
  int32 lease_id = 1;
  bool by_operator = 2;
}

// How a seat is played: by its owner, or by the computer at a level the owner picks. Stasis is for the city seat.
enum SeatLevel {
  SEAT_MANUAL = 0;
  SEAT_STASIS = 1;     // the city holds still: no growth, decay, money or new builds; people keep moving
  SEAT_CARETAKER = 2;  // pays bills, rebuilds like for like, nudges taxes, turns down deals; never expands
  SEAT_AUTOPILOT = 3;  // plays the seat in a style, within the spending cap
}

enum AutopilotStyle {
  STYLE_GROWTH = 0;
  STYLE_GREEN = 1;
  STYLE_PROFIT = 2;
  STYLE_CHAOS = 3;
}

// Claims or hands over a seat ("mayor", or a side game's id). An empty owner leaves it to nobody.
message SetSeat {
  string seat = 1;
  string owner = 2;
  SeatLevel level = 3;
  AutopilotStyle style = 4;
  int64 spend_cap = 5;  // the most the computer may spend in a month
}

// A command for a side game from one of its seats, as the side game's own message bytes (for the bus company,
// a toycity.transport.v1.Command).
message SideGameCommand {
  string game = 1;
  string seat = 2;
  bytes payload = 3;
}

message AttachSideGame {
  string game = 1;
}

enum DisasterKind {
  DISASTER_FIRE = 0;
  DISASTER_TORNADO = 1;
  DISASTER_EARTHQUAKE = 2;
  DISASTER_ROBOT = 3;  // the Clockwork Colossus
}

enum DisasterSetting {
  DISASTERS_OFF = 0;
  DISASTERS_RARE = 1;
  DISASTERS_NORMAL = 2;
}

// Sandbox: start a disaster at a cell. Works whatever the setting is.
message TriggerDisaster {
  DisasterKind kind = 1;
  int32 x = 2;
  int32 y = 3;
}

// How often disasters happen by themselves.
message SetDisasters {
  DisasterSetting setting = 1;
}

// A disaster in progress. x and y are in 1/256ths of a cell so movers animate smoothly.
message Disaster {
  int32 id = 1;
  DisasterKind kind = 2;
  int32 x = 3;
  int32 y = 4;
  int32 days_left = 5;
  int32 destroyed = 6;
  int32 damaged = 7;
}

enum BuildingLook {
  LOOK_FINE = 0;
  LOOK_UNDER_CONSTRUCTION = 1;
  LOOK_STRUGGLING = 2;
  LOOK_RUN_DOWN = 3;
  LOOK_ABANDONED = 4;
  LOOK_DERELICT = 5;
  LOOK_BURNING = 6;
}

// Answer a deal (accept or decline), or dismiss a petition (accept = false).
message RespondPrompt {
  int32 prompt_id = 1;
  bool accept = 2;
}

message SetOrdinance {
  string id = 1;
  bool enact = 2;  // false repeals
}

// A straight or L-shaped run of path cells from (x0,y0) to (x1,y1): horizontal first.
message PlacePath {
  int32 x0 = 1;
  int32 y0 = 2;
  int32 x1 = 3;
  int32 y1 = 4;
  string profile_id = 5;
  bool curved = 6;  // an arc bent toward (cx, cy), snapped to the grid
  int32 cx = 7;
  int32 cy = 8;
  bool diagonal = 9;  // a straight line at any angle, snapped to the grid
}

enum Leftover {
  LEFTOVER_LEAVE = 0;  // cells too deep for a lot stay empty
  LEFTOVER_PARKS = 1;  // they become pocket parks
  LEFTOVER_ZONE = 2;   // they are zoned anyway
}

// Zone the block enclosed by paths around (x, y), as deep as a lot of that density reaches from the road.
message ZoneBlock {
  int32 x = 1;
  int32 y = 2;
  ZoneKind zone = 3;
  Density density = 4;
  Leftover leftover = 5;
}

enum ZoneKind {
  ZONE_NONE = 0;
  ZONE_RESIDENTIAL = 1;
  ZONE_COMMERCIAL = 2;
  ZONE_INDUSTRIAL = 3;
}

enum Density {
  DENSITY_LOW = 0;
  DENSITY_MEDIUM = 1;
  DENSITY_HIGH = 2;
}

enum Wealth {
  WEALTH_LOW = 0;
  WEALTH_MEDIUM = 1;
  WEALTH_HIGH = 2;
}

message PaintZone {
  Rect area = 1;
  ZoneKind zone = 2;  // ZONE_NONE de-zones
  Density density = 3;
}

message PlaceBuilding {
  int32 x = 1;
  int32 y = 2;
  string type_id = 3;
  int32 side = 4;  // roadside types: 1 north, 2 east, 3 south, 4 west kerb; 0 picks one
}

// Upgrades a building in place to one of the types its own type offers (see BuildingTypeInfo.upgrades).
message UpgradeBuilding {
  int32 building_id = 1;
  string to_type_id = 2;
}

message Bulldoze {
  Rect area = 1;
  bool underground = 2;  // true clears water pipes only
}

enum TerraformMode {
  TERRAFORM_RAISE = 0;
  TERRAFORM_LOWER = 1;
  TERRAFORM_LEVEL = 2;
  TERRAFORM_SMOOTH = 3;  // each cell toward its neighbours' average
}

message Terraform {
  Rect area = 1;
  TerraformMode mode = 2;
}

message SetTax {
  ZoneKind zone = 1;
  Wealth wealth = 2;
  int32 percent_tenths = 3;  // 90 = 9.0%
}

message SetFunding {
  int32 building_id = 1;
  int32 percent = 2;  // 0..200
}

message TakeLoan {
  int64 amount = 1;
}

enum UtilityKind {
  UTILITY_POWER_LINE = 0;
  UTILITY_WATER_PIPE = 1;
}

message PlaceUtility {
  int32 x0 = 1;
  int32 y0 = 2;
  int32 x1 = 3;
  int32 y1 = 4;
  UtilityKind kind = 5;
}

message WhyRequest {
  int32 x = 1;
  int32 y = 2;
}

enum OverlayKind {
  OVERLAY_NONE = 0;
  OVERLAY_LAND_VALUE = 1;
  OVERLAY_DESIRABILITY_R = 2;
  OVERLAY_DESIRABILITY_C = 3;
  OVERLAY_DESIRABILITY_I = 4;
  OVERLAY_GROUND_POLLUTION = 5;
  OVERLAY_WATER_POLLUTION = 6;
  OVERLAY_POWER = 7;
  OVERLAY_WATER = 8;
  OVERLAY_TRAFFIC = 9;
  OVERLAY_NOISE = 10;
  OVERLAY_POLICE = 11;
  OVERLAY_FIRE = 12;
  OVERLAY_HEALTH = 13;
  OVERLAY_EDUCATION = 14;
  OVERLAY_PARKS = 15;
  OVERLAY_COMMUTE = 16;
  OVERLAY_ELEVATION = 17;
  OVERLAY_LITTER = 18;
  OVERLAY_BLIGHT = 19;
  OVERLAY_TRANSIT = 20;
}

message OverlayRequest {
  OverlayKind kind = 1;
}

message InspectRequest {
  int32 x = 1;
  int32 y = 2;
}

message SaveRequest {
  string name = 1;  // empty: just list the saves
}

message LoadRequest {
  string name = 1;
}

message NewCityRequest {
  string name = 1;
  uint64 seed = 2;
  int32 size = 3;  // 64, 128 or 256 cells per side
  bool starter_town = 4;  // lay out a small working town to explore
  bool benchmark = 5;  // the benchmark city: 256 cells a side with every dry block built up (ignores size and starter_town)
}

// Beta 3: founds a city on an open tile of this region. The founder is its mayor. The reply is the new RegionState;
// the client then opens the city by connecting with ?tile=COL,ROW.
message FoundCity {
  int32 col = 1;
  int32 row = 2;
  string name = 3;
  bool starter_town = 4;
  string computer = 5;  // a temperament ("growth", "green", "careful") for a computer mayor; empty to be its mayor yourself
}

// A player takes over a computer mayor's city, or a mayor hands their city to a computer mayor of a temperament.
message MayorRequest {
  int32 col = 1;
  int32 row = 2;
  bool take_over = 3;
  string computer = 4;  // the temperament, when handing over
}

// Beta 3, admins only: a new region of open land, with a starter city on the middle tile when starter_town is set.
message NewRegionRequest {
  string name = 1;
  uint64 seed = 2;
  int32 cols = 3;       // 1..8
  int32 rows = 4;       // 1..8
  int32 tile_size = 5;  // 64, 128 or 256
  bool starter_town = 6;
  string city_name = 7;  // the middle tile's city
}

// Moves this connection to another founded city of the region. The server answers with that city's FullState and
// the rest of what a joining client gets, then a RegionState; or, for a city served elsewhere, a RegionState whose
// tile carries its address, to connect to.
message GoToCity {
  int32 col = 1;
  int32 row = 2;
}

// Asks for the region state now (it also comes unasked).
message RegionRequest {}

// The region map: every tile, founded or open, with a small picture of it.
message RegionState {
  string name = 1;
  int32 cols = 2;
  int32 rows = 3;
  int32 tile_size = 4;
  int64 tick = 5;
  repeated RegionTileState tiles = 6;  // row by row
  int32 here_col = 7;  // the tile this connection is in
  int32 here_row = 8;
  int32 speed = 9;     // the region's speed, the slowest any mayor here asked for
  string speed_set_by = 10;  // who holds it there, when it's slower than the host's choice
  repeated NeighbourEdge borders = 11;  // what the neighbours of this connection's city show across its sides
  repeated Deal deals = 12;  // this city's deals with its neighbours, offered or running
  string waiting = 13;       // the region is held waiting for a tile's host ("Waiting for Eastfield's host")
  string stopped = 14;       // the region stopped: a tile's host and its check copy disagreed (a desync), or the border ledgers didn't balance
  int32 ledger_months = 15;  // months in a row this host has checked every border ledger in the region and found it balanced
  int32 cross_border = 16;   // people and tons of goods crossing borders in the region each day this month, from the ledgers
}

// Go to another host for that city (federated regions): address is its /ws URL.
message Redirect {
  string address = 1;
  int32 col = 2;
  int32 row = 3;
}

// ---------------------------------------------------------------------------------------------------------------
// Federated hosting (Beta 3 part 8): a tile host runs one city of a region whose clock another host (the region's
// host) keeps. They talk over /tile-link. Each day the region's host sends DayStart with what the region says to the
// city; the tile host steps it and answers DayEnd with everything the city applied that day, which the region's
// host replays on its check copy. Monthly hashes must agree.
// ---------------------------------------------------------------------------------------------------------------

// Tile host to region host.
message LinkMessage {
  uint32 seq = 1;
  oneof body {
    TileHello hello = 2;
    DayEnd day_end = 3;
    SignIn sign_in = 4;        // a player signing in on the tile host: the region's accounts answer
    LinkForward forward = 5;   // a player's region-wide message (deals, founding, the clock, moving)
  }
}

// Region host to tile host.
message LeaderMessage {
  uint32 reply_to = 1;
  oneof body {
    TileWelcome welcome = 2;
    DayStart day_start = 3;
    SignedIn signed_in = 4;    // answers sign_in
    Error error = 5;           // answers sign_in when it fails
    LinkReply reply = 6;       // what the region host says to a forwarded player's connection
    RegionState region = 7;    // the region map, from this tile
  }
}

message TileHello {
  int32 col = 1;
  int32 row = 2;
  string key = 3;       // the region host's link key
  string address = 4;   // where players reach this tile host's /ws
}

message TileWelcome {
  string error = 1;     // set when the region host won't take this tile host
  string name = 2;
  uint64 seed = 3;
  int32 cols = 4;
  int32 rows = 5;
  int32 tile_size = 6;
  int64 tick = 7;
  bytes save = 8;       // the city as the region host has it: a SaveGame
  string leader_address = 9;  // where players reach the region host's /ws, if it knows
}

message DayStart {
  int64 tick = 1;
  repeated ActionRecord actions = 2;  // what the region tells the city today
  repeated Notice notices = 3;        // news for the city from its neighbours' mayors
  int32 speed = 4;
}

message DayEnd {
  int64 tick = 1;
  repeated ActionRecord log = 2;  // every action the city applied that day, in order
  uint64 hash = 3;                // the city's state hash after the day, on the first of the month
  bool monthly = 4;
  repeated string online = 5;     // players on the tile host now
}

message LinkForward {
  int32 conn = 1;       // the tile host's number for the connection
  string player = 2;
  bool admin = 3;
  ClientMessage message = 4;
}

message LinkReply {
  int32 conn = 1;
  ServerMessage message = 2;
}

enum DealKind {
  DEAL_POWER = 0;    // kW over power lines that meet
  DEAL_WATER = 1;    // water over pipes that meet
  DEAL_GARBAGE = 2;  // garbage the seller takes in, over roads that meet
  DEAL_TRANSIT = 3;  // a shuttle the seller runs, vehicles an hour, over roads that meet
}

// A deal between two neighbouring cities, on the region's books.
message Deal {
  int32 id = 1;
  DealKind kind = 2;
  int32 seller_col = 3;
  int32 seller_row = 4;
  int32 buyer_col = 5;
  int32 buyer_row = 6;
  string seller = 7;   // the cities' names
  string buyer = 8;
  int32 amount = 9;
  int32 price = 10;    // a month, paid by the buyer to the seller
  bool active = 11;    // false while it waits for an answer
  bool offered_by_seller = 12;
  int32 round = 13;    // how many times it's been countered
}

// A mayor offers a deal to the neighbour across a side of their city, answers one offered to them, or withdraws or
// ends one. The answer is a RegionState, or an Error.
message DealRequest {
  enum Op {
    OFFER = 0;
    ACCEPT = 1;
    DECLINE = 2;
    END = 3;
    COUNTER = 4;      // answer an offer with other terms (amount, price)
  }
  Op op = 1;
  int32 id = 2;       // accept, decline, end, counter
  int32 side = 3;     // offer: the side the neighbour is on
  DealKind kind = 4;
  int32 amount = 5;
  int32 price = 6;
  bool selling = 7;   // offer: true to sell to the neighbour, false to buy from it
}

message RegionTileState {
  int32 col = 1;
  int32 row = 2;
  bool founded = 3;
  string name = 4;
  string mayor = 5;
  int32 population = 6;
  bytes picture = 7;   // RegionPictureSize^2 RGB triples, row-major, north up
  repeated string players = 8;  // players in this city now
  int64 funds = 9;
  string address = 10;  // where this tile's city is served, when not by the server this came from (federated)
  string computer = 11; // a computer mayor's temperament ("growth-hungry", "green", "careful"); empty for a player
  string weather = 12;  // today's weather over it, as in CityStats.weather
}

message SetSpeed {
  int32 speed = 1;  // 0 = paused, 1..3
}

message DemandRequest {}

// Runs a copy of the city ahead. With no plan it shows exactly what happens if the player does nothing.
message ForecastRequest {
  int32 months = 1;          // 1..120
  repeated Action plan = 2;  // optional "what if": applied to the copy first
}

message EncyclopediaRequest {}

message OrdinancesRequest {}

message AdvisorsRequest {}

// ---------------------------------------------------------------------------
// Server -> client
// ---------------------------------------------------------------------------

message ServerMessage {
  uint32 reply_to = 1;  // seq of the client message this answers, 0 if unsolicited
  oneof body {
    Welcome welcome = 2;
    FullState full = 3;
    TickDelta delta = 4;
    WhyResult why = 5;
    OverlayData overlay = 6;
    InspectResult inspect = 7;
    Notice notice = 8;
    Error error = 9;
    SaveList saves = 10;
    DemandReport demand = 11;
    ForecastResult forecast = 12;
    Encyclopedia encyclopedia = 13;
    AlertList alerts = 14;  // sent whenever the list changes
    OrdinanceList ordinances = 15;
    CivicState civic = 16;  // petitions, deals, approval, unlocks and headlines; sent whenever they change
    AdvisorList advisors = 17;
    AgentRoster agents = 18;  // the followed commuters; sent when they change and monthly
    SideGameView side_game = 19;  // sent when a side game's view changes
    SignedIn signed_in = 20;
    Presence presence = 21;  // who is here; sent when someone joins or leaves
    DelinkCopy delink_copy = 22;  // to a player who just de-linked: their copy of the city, as a save
    RegionState region = 23;  // the region this city is in: sent on joining, monthly, and when a tile changes hands
    Redirect redirect = 24;   // the city asked for is served by another host: connect there
  }
  // On presence, alerts, civic and agents: when the server built this snapshot, rising over the connection. Several
  // players acting at once can have their snapshots overtake each other on the way out; a client keeps the latest.
  uint64 order = 25;
}

// The copy a de-linked player takes with them. The server also keeps it in its saves under this name.
message DelinkCopy {
  string name = 1;
  bytes save = 2;  // a SaveGame
}

// The players on this server: everyone online, and everyone who owns a seat here even while they're away.
message Presence {
  message Player {
    string name = 1;
    bool online = 2;
    bool admin = 3;
    repeated string seats = 4;  // seat ids they own
    bool spectator = 5;         // online but owns no seat and isn't a deputy: watches only
    repeated string deputy_for = 6;  // portfolios as a deputy mayor: "planning", "budget", "services", "transit"
  }
  repeated Player players = 1;
}

// The first message on every connection. A server that needs no sign-in (solo play) has already signed the
// connection in as player and sends the city straight after; one that does sends nothing more until SignIn.
message Welcome {
  uint32 protocol_version = 1;
  string server_name = 2;
  bool sign_in_required = 3;
  bool invite_required = 4;  // new accounts need the host's invite code
  string player = 5;         // who this connection plays as, when signed in already
  bool admin = 6;            // may save, load, start a new city and set the speed
}

// Signed in: the city follows. Keep the token to sign in again without the password.
message SignedIn {
  string name = 1;
  string token = 2;
  bool admin = 3;
}

message PathProfileInfo {
  string id = 1;
  string name = 2;
  string kind = 3;  // "path"
  int32 speed_kmh = 4;
  bool cars = 5;
  bool bikes = 6;
  bool pedestrians = 7;
  bool one_way = 8;
  int64 cost_per_cell = 9;
  string color = 10;
  int32 width_m = 11;
  bool frontage = 12;  // lots beside it get road access (false for highways)
  string tram = 13;    // "shared", "dedicated" or empty
  bool rail = 14;      // trains only
}

message BuildingTypeInfo {
  string id = 1;
  string name = 2;
  string category = 3;  // "zoned", "power", "water", "garbage", "police", "fire", "health", "education", "park"
  ZoneKind zone = 4;
  Density density = 5;
  Wealth wealth = 6;
  int32 width = 7;
  int32 height = 8;
  int64 cost = 9;
  bool placeable = 10;  // true for buildings the mayor places directly
  string color = 11;
  string unlock_text = 12;  // how to unlock it; empty when always available
  bool unique = 13;         // one per city
  int64 income = 14;        // paid to the city monthly while it operates
  int32 attraction = 15;
  string transit = 16;  // "bus", "tram", "rail" or empty
  int32 capacity = 17;  // transit: people a day
  int32 catchment = 18; // transit: walking reach in cells
  bool roadside = 19;   // stands on a road's kerb instead of on land (bus stops)
  string lot_kind = 20; // side games can lease it as this kind of lot; empty when not
  int32 maintenance = 21;  // a month
  int64 lease_rent = 22;   // standard lease rent a month
  repeated UpgradeInfo upgrades = 23;
  int32 build_days = 24;   // days from groundbreaking to opening
}

// An upgrade a type offers: what it becomes, what it costs and what the building must earn first.
message UpgradeInfo {
  string to_type_id = 1;
  int64 cost = 2;
  int32 riders = 3;      // riders a day needed; 0 when not
  int32 population = 4;  // city population needed; 0 when not
  ZoneKind near_zone = 5;  // zoned buildings needed within 3 cells; ZONE_NONE when not
  string text = 6;
}

message Catalog {
  repeated PathProfileInfo profiles = 1;
  repeated BuildingTypeInfo building_types = 2;
  repeated int32 lot_depth = 3;  // deepest lot a zoned building can grow on, by density (low, medium, high)
  repeated string street_names = 4;  // for naming roads as the server does (see World.StreetAt)
  repeated string street_kinds = 5;
}

message BuildingState {
  int32 id = 1;
  string type_id = 2;
  int32 x = 3;
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
  ZoneKind zone = 7;
  Density density = 8;
  Wealth wealth = 9;
  string name = 10;
  int32 residents = 11;
  int32 jobs = 12;
  int32 workers = 13;
  bool powered = 14;
  bool watered = 15;
  bool abandoned = 16;
  int32 construction_days_left = 17;
  int32 funding_percent = 18;
  int32 condition = 19;  // 0..100
  int32 graffiti = 20;   // 0..3
  int32 burning_days = 21;
  BuildingLook look = 22;
  int32 riders = 23;  // transit stops: people getting on or off a day
  int32 side = 24;    // roadside buildings: 0 north, 1 east, 2 south, 3 west kerb of the road cell at x, y
}

message CityStats {
  int64 tick = 1;
  int32 year = 2;
  int32 month = 3;  // 1..12
  int32 day = 4;    // 1..30
  int64 funds = 5;
  int32 population = 6;
  int32 jobs = 7;
  int32 workers = 8;
  repeated int32 demand = 9;  // R low, R med, R high, C low, C med, C high, I low, I med, I high; -100..100
  repeated int32 tax_tenths = 10;  // same order as demand
  int64 last_month_income = 11;
  int64 last_month_expenses = 12;
  int64 debt = 13;
  int32 speed = 14;
  int64 power_capacity_kw = 15;
  int64 power_demand_kw = 16;
  int64 water_capacity = 17;
  int64 water_demand = 18;
  int64 garbage_capacity = 19;
  int64 garbage_produced = 20;
  string city_name = 21;
  repeated BudgetLine budget = 22;
  repeated int32 demand_raw = 23;  // demand before capacity limits, same order as demand
  repeated Disaster disasters = 24;
  DisasterSetting disaster_setting = 25;
  int32 transit_boardings = 26;  // a day, from last month's commutes
  string weather = 27;           // today's weather over the city with its icon ("🌧 Heavy rain"); empty when clear
}

message BudgetLine {
  string label = 1;
  int64 amount = 2;  // positive income, negative expense
}

message FullState {
  int32 width = 1;
  int32 height = 2;
  int32 water_level = 3;
  bytes heights = 4;        // one byte per cell
  bytes zones = 5;          // zone kind * 3 + density, 0 = none; see ZoneCode in the sim
  bytes paths = 6;          // uint16 little-endian per cell: profile index + 1, 0 = none
  bytes power_lines = 7;    // one byte per cell, 0/1
  bytes water_pipes = 8;    // one byte per cell, 0/1
  repeated BuildingState buildings = 9;
  CityStats stats = 10;
  Catalog catalog = 11;
  uint64 seed = 12;
  repeated RoadStrip strips = 13;
}

// An arc or diagonal as it was drawn: clients draw this line over its cells. Straight from (x0,y0) to (x1,y1), or
// when curved a quadratic arc bent toward (cx,cy), through the cells' centres.
message RoadStrip {
  int32 path = 1;  // profile index + 1, as in FullState.paths
  bool curved = 2;
  int32 x0 = 3;
  int32 y0 = 4;
  int32 x1 = 5;
  int32 y1 = 6;
  int32 cx = 7;
  int32 cy = 8;
  repeated int32 cells = 9;  // the cells it runs through, as indexes
}

message CellUpdate {
  int32 index = 1;
  int32 height = 2;
  int32 zone = 3;
  int32 path = 4;
  bool power_line = 5;
  bool water_pipe = 6;
}

message TickDelta {
  repeated CellUpdate cells = 1;
  repeated BuildingState buildings = 2;
  repeated int32 removed_buildings = 3;
  CityStats stats = 4;
  repeated Notice notices = 5;
  bool strips_changed = 6;           // the city's road strips changed: strips is the whole new list
  repeated RoadStrip strips = 7;
}

message Requirement {
  string key = 1;
  string label = 2;
  bool met = 3;
  string detail = 4;  // plain-language value vs threshold, and what would fix it
  string topic = 5;   // encyclopedia article that explains the rule
}

message WhyResult {
  int32 x = 1;
  int32 y = 2;
  string subject = 3;   // what is on the cell, in plain words
  string summary = 4;   // one-line verdict
  repeated Requirement requirements = 5;
  repeated Factor factors = 6;
  repeated Gauge gauges = 7;  // public buildings: what they serve against their capacity, then a quirky statistic
}

// One gauge on a building's panel: value of max, in unit. A fun one is one of the city's quirky statistics.
message Gauge {
  string label = 1;
  int64 value = 2;
  int64 max = 3;
  string unit = 4;
  bool fun = 5;
}

message Factor {
  string label = 1;
  int32 value = 2;  // signed contribution, for example to desirability
}

message OverlayData {
  OverlayKind kind = 1;
  bytes values = 2;  // one byte per cell, 0..255
  string legend_low = 3;
  string legend_high = 4;
}

message InspectResult {
  int32 x = 1;
  int32 y = 2;
  repeated KeyValue fields = 3;
  BuildingState building = 4;
  repeated CitizenInfo residents = 5;  // the people who live here, one by one
  repeated UpgradeChoice upgrades = 6;  // what the building could become, on offer or not yet
}

message UpgradeChoice {
  string to_type_id = 1;
  string name = 2;
  int64 cost = 3;
  bool available = 4;
  string why_not = 5;  // what it still needs; empty when available
  string text = 6;
}

// One resident. Citizens are the home's counts seen one person at a time, so they always add up to the city's totals.
message CitizenInfo {
  int64 id = 1;
  string name = 2;
  int32 age = 3;
  string role = 4;          // "worker", "job seeker", "child", "retiree"
  string job = 5;           // workplace name, empty without one
  int32 job_x = 6;
  int32 job_y = 7;
  bool by_transit = 8;
  int32 commute_minutes = 9;
  string tier = 10;         // "full" (on the map, tracked daily), "light" (monthly record) or "household"
  int32 days_tracked = 11;  // full agents: days followed so far
  int32 days_late = 12;     // full agents: days they reached work after nine
  int32 avg_minutes = 13;   // full agents: average door-to-door minutes at the day's congestion
  int32 since_month = 14;   // month index they moved in
}

// The commuters drawn on the map. Each walks or rides its cells in order, leaving home at depart_minute.
message AgentTripInfo {
  int64 id = 1;
  int32 depart_minute = 2;  // minutes after midnight
  int32 minutes = 3;        // door-to-door at the day's congestion
  bool by_transit = 4;
  repeated int32 cells = 5;
}

// What a side game shows its seat, as the side game's own message bytes (for the bus company, a
// toycity.transport.v1.View), plus the city's word on it.
message SideGameView {
  string game = 1;
  string name = 2;
  string seat = 3;
  bytes payload = 4;
  string status = 5;
}

message AgentRoster {
  int32 full_tier = 1;   // this machine's limits, from its benchmark
  int32 light_tier = 2;
  int32 full = 3;        // how many are followed now
  int32 light = 4;
  int32 citizens = 5;
  string machine = 6;    // what the benchmark measured
  repeated AgentTripInfo trips = 7;  // at most a few thousand, the first full agents
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message Notice {
  string text = 1;
  string severity = 2;  // "info", "warning", "good"
  int32 x = 3;          // -1 when not located
  int32 y = 4;
}

// One line of a zone's demand. points has one value shared by every wealth level, or three (low, medium, high).
message DemandLine {
  string key = 1;
  string label = 2;
  repeated int32 points = 3;
  string detail = 4;
}

message ZoneDemand {
  ZoneKind zone = 1;
  repeated int32 raw = 2;    // by wealth, before limits
  repeated int32 final = 3;  // by wealth, what growth uses
  repeated DemandLine sources = 4;      // local, regional, external, and what already exists
  repeated DemandLine adjustments = 5;  // per wealth: taxes, education, city size
  repeated DemandLine limits = 6;       // capacity limits: power headroom, room to grow
  string binding_key = 7;  // the one thing holding this zone back
  string binding = 8;
  int32 x = 9;  // where to look, -1 if nowhere in particular
  int32 y = 10;
  string topic = 11;
}

message DemandReport {
  repeated ZoneDemand zones = 1;
}

message Alert {
  string key = 1;
  string severity = 2;  // "danger", "warning", "info"
  string text = 3;
  int32 x = 4;  // -1 when not located
  int32 y = 5;
  int32 count = 6;
  string topic = 7;
  string fix_type = 8;  // a building that would help, empty when none would
  Rect area = 9;        // what to highlight: the building, or the neighbourhood (x0 = -1 when not located)
}

message AlertList {
  repeated Alert alerts = 1;
}

message ForecastPoint {
  int32 year = 1;
  int32 month = 2;
  int32 population = 3;
  int32 jobs = 4;
  int32 workers = 5;
  int64 funds = 6;
  repeated int32 demand = 7;
  int32 power_percent = 8;
  int32 water_percent = 9;
  int32 abandoned = 10;
}

message ForecastEvent {
  int32 year = 1;
  int32 month = 2;
  string severity = 3;
  string text = 4;
  int32 x = 5;
  int32 y = 6;
}

message ForecastResult {
  int32 months = 1;
  repeated ForecastPoint points = 2;
  repeated ForecastEvent events = 3;
  repeated string summary = 4;
  bool with_plan = 5;
}

message Article {
  string id = 1;
  string title = 2;
  string category = 3;
  repeated string paragraphs = 4;
  repeated KeyValue facts = 5;
  repeated string see_also = 6;
}

message Encyclopedia {
  repeated Article articles = 1;
}

enum OrdinanceStatus {
  ORDINANCE_LOCKED = 0;
  ORDINANCE_AVAILABLE = 1;
  ORDINANCE_OFFERED = 2;  // a time-limited offer the player can take
  ORDINANCE_ENACTED = 3;
}

// An ordinance with its live preview: the rule graph run against the city as it is now.
message Ordinance {
  string id = 1;
  string name = 2;
  string category = 3;
  string description = 4;
  string availability = 5;
  OrdinanceStatus status = 6;
  int32 months_left = 7;  // to decide on an offer, or until a time-limited ordinance ends
  int64 monthly_net = 8;  // income minus cost, this month
  repeated string effects = 9;
  repeated KeyValue steps = 10;  // each labelled step of the graph and its value now
}

message OrdinanceList {
  repeated Ordinance ordinances = 1;
}

enum PromptStatus {
  PROMPT_OPEN = 0;
  PROMPT_FULFILLED = 1;
  PROMPT_IGNORED = 2;
  PROMPT_ACCEPTED = 3;
  PROMPT_DECLINED = 4;
}

// A petition or deal put to the mayor.
message Prompt {
  int32 id = 1;
  string event_id = 2;
  string kind = 3;  // "petition" or "deal"
  int32 x = 4;      // -1 when not located
  int32 y = 5;
  string petitioner = 6;
  string text = 7;
  string goal = 8;  // for petitions: what would satisfy them
  PromptStatus status = 9;
  int32 months_left = 10;
  string result_text = 11;
  string fix_type = 12;  // petitions: the building whose coverage would satisfy them, empty when none
  Rect area = 13;        // the petitioners' neighbourhood (x0 = -1 when not located)
  string progress = 14;  // open petitions: where the goal's measures stand now, e.g. "Police coverage here (%): 22"
}

message Headline {
  int64 seq = 1;
  int64 tick = 2;
  string text = 3;
  string severity = 4;
  int32 x = 5;
  int32 y = 6;
}

message CivicState {
  repeated Prompt prompts = 1;
  repeated string unlocked_types = 2;
  int32 approval = 3;
  repeated Headline headlines = 4;  // newest last
  repeated SeatState seats = 5;     // the mayor's seat first
  repeated LeaseState leases = 6;
  repeated SideGameInfo side_games = 7;
  ConsentTable consent = 8;
  repeated Deputy deputies = 9;
  bool council_on = 10;
  repeated Proposal proposals = 11;  // open ones first, then the last few decided
  repeated string council = 12;      // who votes: every seat owner and deputy
  repeated DelinkState delinks = 13; // de-links, newest first
  repeated DelinkOption delink_options = 14;  // each player with a part here besides the mayor: whether the mayor may cut them loose
  repeated DistrictFranchise franchises = 15;  // every district: its transit franchise, if any, or the tender for it
  repeated SideGameOffer invitable = 16;       // side games this server can add that the city doesn't have yet
  int32 freight_exports = 17;    // tons a day company freight carried out of the city last month
  int32 freight_delivered = 18;  // tons a day company freight delivered to shops last month
}

// A side game the mayor can invite in, such as a rival transit company.
message SideGameOffer {
  string id = 1;
  string name = 2;
  string description = 3;
}

// A district's transit franchise. status: "none", "open" (out to tender), "held".
message DistrictFranchise {
  int32 district = 1;
  string name = 2;
  string status = 3;
  int32 months = 4;
  int32 days_left = 5;   // until the tender closes, or the franchise ends
  int32 bids = 6;        // bids in so far (their amounts are sealed)
  string holder = 7;     // the holding side game's id
  string holder_name = 8;
  int64 amount = 9;      // what the holder paid
  bool exclusive = 10;
  string last = 11;      // how the last tender here went, if one closed without a winner
}

message DelinkOption {
  string player = 1;
  bool open = 2;
  string rule = 3;
}

message DelinkState {
  int32 day = 1;
  string player = 2;
  string mayor = 3;
  string by = 4;  // the player themselves, or the mayor who cut them loose
  repeated string games = 5;
  int32 leases_ended = 6;
  int64 written_off = 7;
  int64 paid = 8;
  int32 cooldown_days = 9;  // days left before the two may share a city again; 0 when over
}

message Deputy {
  string player = 1;
  uint32 portfolios = 2;  // bits: 1 planning, 2 budget, 4 services, 8 transit
}

message Proposal {
  int32 id = 1;
  string text = 2;
  string proposer = 3;
  int32 days_left = 4;
  string status = 5;  // "open", "passed" or "failed"
  repeated string yes = 6;
  repeated string no = 7;
}

// Every seat owner against every mechanic: the effective result and who is blocking each one.
message ConsentTable {
  repeated string owners = 1;
  repeated ConsentRow rows = 2;
  repeated PactState pacts = 3;
}

message ConsentRow {
  Mechanic mechanic = 1;
  string name = 2;
  string note = 3;
  repeated bool by_owner = 4;  // in the order of owners
  bool effective = 5;
  repeated string blockers = 6;
  bool pairwise = 7;       // needs only the two players it happens between (or a pact), not everyone
  bool host_forbids = 8;   // the server's host forbids it
  bool city_forbids = 9;   // the city's rules forbid it
}

message PactState {
  string a = 1;
  string b = 2;
  Mechanic mechanic = 3;
  bool offer = 4;  // offered by a to b, not yet accepted
}

// A side game's standing in a district.
message StandingState {
  int32 district = 1;
  string district_name = 2;
  int32 rating = 3;  // -1000..1000
  int32 target = 4;  // where it is heading this month
  bool statue = 5;
  int32 exclusive_days = 6;
  int32 bribe_ban_days = 7;
}

message SideGameInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string lot_kinds = 4;  // building type ids it can lease
  repeated StandingState standings = 5;
}

message LeaseState {
  int32 id = 1;
  string game = 2;
  string game_name = 3;
  int32 building_id = 4;
  string kind = 5;
  int32 x = 6;
  int32 y = 7;
  LeaseTerms terms = 8;
  LeaseTerms pending_terms = 9;  // unset when none
  int32 pending_months = 10;
  int64 arrears = 11;
  bool bad_standing = 12;
  int32 cure_months_left = 13;
  bool terminable = 14;
  int32 jobs = 15;
  int64 last_month_fares = 16;
  repeated string targets = 17;  // what it takes to get back into good standing
  int32 evict_months = 18;       // months until a hostile eviction ends it; 0 when none
  int32 rating = 19;             // the side game's rating in the lot's district
  repeated LadderStep ladder = 20;  // the dispute ladder, gentlest first
  repeated OfferState offers = 21;  // the open offer, if any, then the last few decided
  repeated MoveTarget move_to = 22;  // free lots of the same kind it could move to
}

message MoveTarget {
  int32 building_id = 1;
  int32 x = 2;
  int32 y = 3;
  string name = 4;
}

message LadderStep {
  string step = 1;  // "Negotiate", "Buy out", "Relocate", "Impose terms", "Evict"
  bool open = 2;    // whether it can be taken now
  string rule = 3;  // the rule that allows it, or what stands in the way
}

message OfferState {
  int32 id = 1;
  OfferKind kind = 2;
  bool from_operator = 3;
  string by = 4;  // the player who made it; empty for the computer
  LeaseTerms terms = 5;
  int64 amount = 6;
  int32 to_building_id = 7;
  int32 to_x = 8;
  int32 to_y = 9;
  string status = 10;  // "open", "accepted", "declined", "countered", "withdrawn", "expired", "failed"
  int32 days_left = 11;
  string text = 12;    // what it proposes, in words
  string note = 13;    // how it ended
  int32 counter_of = 14;
}

message SeatState {
  string id = 1;
  string name = 2;  // "City" or the side game's name
  string owner = 3;
  SeatLevel level = 4;
  AutopilotStyle style = 5;
  int64 spend_cap = 6;
  int64 away_since_tick = 7;  // -1 when the owner is playing it
  AwayReport report = 8;      // the last "while you were away" report, if any
  SeatLevel away_level = 9;   // how the computer plays it while the owner is away from a dedicated server
  AutopilotStyle away_style = 10;
  bool auto_away = 11;        // the computer has it because the owner left; it goes back when they return
}

message AwayNote {
  int64 tick = 1;
  string text = 2;
  int32 x = 3;  // -1 when not located
  int32 y = 4;
}

message AwayReport {
  int64 from_tick = 1;
  int64 to_tick = 2;
  SeatLevel level = 3;
  repeated string changes = 4;
  repeated AwayNote notes = 5;
  repeated string news = 6;
}

message Advisor {
  string role = 1;
  string name = 2;
  string title = 3;
  string mood = 4;  // "happy", "worried", "alarmed"
  repeated Alert messages = 5;
}

message AdvisorList {
  repeated Advisor advisors = 1;
  int32 approval = 2;
  repeated Factor approval_factors = 3;
}

message Error {
  string message = 1;
}

message SaveList {
  repeated string names = 1;
}

// ---------------------------------------------------------------------------
// Save format
// ---------------------------------------------------------------------------

message SaveGame {
  uint32 format_version = 1;
  string city_name = 2;
  uint64 seed = 3;
  int32 width = 4;
  int32 height = 5;
  int64 tick = 6;
  bytes world = 7;  // the sim's own binary world snapshot (versioned by format_version)
  repeated ActionRecord log = 8;
}

// A region save: the region's shape and day, and a SaveGame for each founded city.
message RegionSave {
  uint32 format_version = 1;
  string name = 2;
  uint64 seed = 3;
  int32 cols = 4;
  int32 rows = 5;
  int32 tile_size = 6;
  int64 tick = 7;
  repeated RegionSavedCity cities = 8;
  repeated Deal offers = 9;  // deals offered and not yet answered; running ones are in the cities
}

message RegionSavedCity {
  int32 col = 1;
  int32 row = 2;
  bytes save = 3;  // a SaveGame
}

message ActionRecord {
  int64 tick = 1;
  Action action = 2;
  string by = 3;       // the player who sent it; empty for saves from before Beta 2
  SeatAway away = 4;   // set instead of action: the server handed a seat to the computer, or back, as its owner left or returned
  HostRules host_rules = 5;  // set instead of action: the server's minimums when the city arrived
  RenameOwner rename = 6;    // set instead of action: the server gave one player's seats to another
  SideGameMissed missed = 7; // set instead of action: a side game hosted elsewhere missed its deadline
  Fork fork = 8;             // set instead of action: this city is a copy a player took when they de-linked
  NeighbourEdge neighbour = 9;  // set instead of action: the region said what a neighbouring city shows across a border
  CityDeal deal = 10;           // set instead of action: the region started or ended a deal with a neighbour
  RegionWeather weather = 11;   // set instead of action: the region's weather over the city changed
}

enum WeatherKind {
  WEATHER_CLEAR = 0;
  WEATHER_RAIN = 1;
  WEATHER_SNOW = 2;
  WEATHER_HEAT = 3;
  WEATHER_WIND = 4;
}

message RegionWeather {
  WeatherKind kind = 1;
  int32 strength = 2;  // 1 light .. 3 severe
}

// A deal as one of its two cities keeps it.
message CityDeal {
  int32 id = 1;
  DealKind kind = 2;
  bool selling = 3;
  int32 side = 4;    // the side the other city is on
  string other = 5;
  int32 amount = 6;
  int32 price = 7;
  bool end = 8;
  string why = 9;
}

// What a neighbouring city shows across one side of this one (0 north, 1 east, 2 south, 3 west). Cell k runs along
// the side: x on the north and south, y on the east and west. An empty name means no city there.
message NeighbourEdge {
  int32 side = 1;
  string name = 2;
  string mayor = 3;
  repeated int32 paths = 4;  // pairs: cell, path profile index + 1
  repeated int32 power = 5;  // cells with a power line
  repeated int32 pipes = 6;  // cells with a water pipe
  repeated int32 stats = 7;  // the neighbour's published numbers at the start of its month (World.Published)
  repeated int32 fire = 8;   // cells where the neighbour has a building on fire at the border
  repeated int32 movers = 9; // disasters walking over the border into this city: kind, cell, dx, dy, days left
}

message Fork {
  string player = 1;
  string home_name = 2;
}

message SideGameMissed {
  string game = 1;
  string what = 2;  // "day" or "command"
}

message RenameOwner {
  string from = 1;
  string to = 2;
}

message HostRules {
  repeated Mechanic forbidden = 1;
}

message SeatAway {
  string seat = 1;
  bool away = 2;
}
