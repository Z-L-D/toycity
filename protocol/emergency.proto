// ToyCity emergency services side game: its own messages. They travel inside the city protocol as bytes: a Command
// inside toycity.v0.SideGameCommand.payload, a View inside toycity.v0.SideGameView.payload. The city never reads
// them; only the emergency services and their front end do.
syntax = "proto3";

package toycity.emergency.v1;

option csharp_namespace = "ToyCity.Emergency.Wire";

enum UnitKind {
  ENGINE = 0;     // a fire engine and its firefighters
  PATROL = 1;     // a police car and its officers
  AMBULANCE = 2;  // an ambulance and its paramedics
}

// Who answers calls while a player runs the service.
enum CommandStyle {
  FULL_COMMAND = 0;   // calls wait for the player; the player runs every scene
  SCENE_COMMAND = 1;  // the computer dispatches; the player runs every scene
  FOCUS = 2;          // the computer handles every call; the player runs only the scenes they take
}

enum Role {
  FIREFIGHTER = 0;
  PARAMEDIC = 1;
  OFFICER = 2;
  BYSTANDER = 3;
  CASUALTY = 4;
  SUSPECT = 5;
}

enum TaskKind {
  NONE = 0;
  HOSE = 1;     // spray the fire at a tile
  TREAT = 2;    // treat a casualty
  ARREST = 3;   // close in on a suspect and cuff them
  WARN = 4;     // call on a suspect to give up
  SHOOT = 5;    // fire at a tile: hits the first person on the line
  TASER = 6;    // the same, but it only stuns
}

message Command {
  oneof kind {
    Dispatch dispatch = 1;
    TakeScene take = 2;
    LeaveScene leave = 3;
    SceneStep step = 4;
    MoveOrder move = 5;
    PathOrder path = 6;
    TaskOrder task = 7;
    Settings settings = 8;
    BuyUnit buy = 9;
    SellUnit sell = 10;
  }
}

// Sends these units to a call (a player's pick, or changing the computer's).
message Dispatch {
  int32 call_id = 1;
  repeated int32 unit_ids = 2;
}

// Focus: the player runs this call's scene themselves.
message TakeScene {
  int32 call_id = 1;
}

// Hands a scene to the crews: the computer finishes it.
message LeaveScene {
  int32 scene_id = 1;
}

// Runs a scene on by this many steps (a quarter second each). The player's client sends these while the scene is open.
message SceneStep {
  int32 scene_id = 1;
  int32 steps = 2;
}

// These people or vehicles find their own way to a tile.
message MoveOrder {
  int32 scene_id = 1;
  repeated int32 ids = 2;
  int32 x = 3;
  int32 y = 4;
}

// One person or vehicle follows exactly this path, tile by tile.
message PathOrder {
  int32 scene_id = 1;
  int32 id = 2;
  repeated int32 tiles = 3;  // y * width + x
}

message TaskOrder {
  int32 scene_id = 1;
  repeated int32 ids = 2;
  TaskKind task = 3;
  int32 x = 4;          // the target tile
  int32 y = 5;
  int32 target_id = 6;  // the target person, when the task is about one
}

message Settings {
  CommandStyle style = 1;
  bool pick_responders = 2;
  bool crews_use_heads = 3;
  bool drivers_watch_out = 4;
  string name = 5;  // empty keeps it
}

message BuyUnit {
  int32 lease_id = 1;
  UnitKind kind = 2;
}

message SellUnit {
  int32 unit_id = 1;
}

// ---------------------------------------------------------------------------
// The view
// ---------------------------------------------------------------------------

message View {
  string name = 1;
  int64 cash = 2;
  string operator = 3;  // "manual", "caretaker", "autopilot", "stasis"
  string owner = 4;
  CommandStyle style = 5;
  bool pick_responders = 6;
  bool crews_use_heads = 7;
  bool drivers_watch_out = 8;
  int32 respect = 9;   // -100..100: the crews' and the public's view of the service
  int32 service_quality = 10;
  repeated StationView stations = 11;
  repeated UnitView units = 12;
  repeated CallView calls = 13;
  repeated SceneView scenes = 14;
  repeated ReportCard cards = 15;  // the last few scenes, newest last
  repeated string log = 16;        // newest last
  MonthMoney this_month = 17;
  MonthMoney last_month = 18;
  int32 day = 19;
  repeated OpenStation open_stations = 20;
}

message MonthMoney {
  int64 subsidy = 1;
  int64 wages = 2;
  int64 upkeep = 3;
  int64 vehicles = 4;
  int64 profit = 5;
}

message StationView {
  int32 lease_id = 1;
  string kind = 2;  // "fire-station", "police-station", "clinic", "hospital"
  int32 x = 3;
  int32 y = 4;
  string name = 5;
}

message OpenStation {
  int32 building_id = 1;
  string kind = 2;
  int32 x = 3;
  int32 y = 4;
}

message UnitView {
  int32 id = 1;
  string name = 2;  // "Engine 2"
  UnitKind kind = 3;
  int32 station_lease_id = 4;
  int32 crew = 5;
  string state = 6;  // "ready", "proposed", "on call", "at scene", "suspended"
  int32 call_id = 7;
  int32 back_in_days = 8;
}

message CallView {
  int32 id = 1;
  string kind = 2;  // "fire", "crime", "injury"
  int32 x = 3;
  int32 y = 4;
  int32 severity = 5;
  string text = 6;
  string status = 7;  // "waiting", "proposed", "rolling", "scene", "done"
  repeated int32 unit_ids = 8;
  int32 waited_days = 9;
  string outcome = 10;
  int32 minutes = 11;
  int32 scene_id = 12;
}

message SceneView {
  int32 id = 1;
  int32 call_id = 2;
  string kind = 3;
  int32 origin_x = 4;  // the city cell at the scene's top-left
  int32 origin_y = 5;
  int32 width = 6;     // tiles; four to a city cell
  int32 height = 7;
  bytes tiles = 8;     // per tile: 0 ground, 1 road, 2 building, 3 water, 4 park, 5 burnt
  bytes fire = 9;      // per tile: 0..100
  repeated PersonView people = 10;
  repeated VehicleView vehicles = 11;
  int32 step = 12;
  int32 burning = 13;  // tiles alight
  repeated string events = 14;  // what just happened, newest last
  repeated Arrival arriving = 15;
}

message PersonView {
  int32 id = 1;
  Role role = 2;
  int32 x = 3;  // in sixteenths of a tile
  int32 y = 4;
  int32 health = 5;
  TaskKind task = 6;
  int32 unit_id = 7;  // the vehicle a crew member came with
  bool armed = 8;
  bool down = 9;      // stunned, cuffed or dead: not moving
  string state = 10;  // "ok", "stable", "cuffed", "dead", "stunned", "escaped"
  repeated int32 path = 11;
}

message VehicleView {
  int32 id = 1;  // the unit id
  UnitKind kind = 2;
  int32 x = 3;
  int32 y = 4;
  repeated int32 path = 5;
}

message Arrival {
  int32 unit_id = 1;
  int32 at_step = 2;
}

message ReportCard {
  int32 scene_id = 1;
  string kind = 2;
  string where = 3;
  int32 response_minutes = 4;
  int32 saved = 5;
  int32 lost = 6;
  int32 harmed_by_crews = 7;
  int32 friendly_fire = 8;
  int32 unauthorized_force = 9;
  int32 property_lost_percent = 10;
  int32 score = 11;
  string outcome = 12;
  repeated string notes = 13;
}
