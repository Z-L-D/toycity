name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ToyCity.slnx -c Release
      - run: dotnet test ToyCity.slnx -c Release --no-build
      - name: Headless run (5 years)
        run: dotnet run --project tools/ToyCity.Bench -c Release --no-build -- 5
      - name: Agent tiers on this runner
        run: |
          dotnet run --project tools/ToyCity.Bench -c Release --no-build -- tiers --quick --out tiers-quick.json
          dotnet run --project tools/ToyCity.Bench -c Release --no-build -- tiers --out tiers-full.json
          { echo '### Agent tiers on this runner'; echo '```json'; cat tiers-quick.json; echo; cat tiers-full.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run build

  godot:
    runs-on: ubuntu-latest
    env:
      GODOT: Godot_v4.7.2-stable_mono_linux_x86_64
      GODOT_SHA512: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download Godot 4.7.2 .NET and check it
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT_BIN=$RUNNER_TEMP/$GODOT/${GODOT/_x86_64/}.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build src/ToyCity.Server -c Release
      - run: dotnet build clients/godot
      - name: Smoke test against a live server
        run: |
          dotnet run --project src/ToyCity.Server -c Release --no-build > server.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:5180/health && break; sleep 1; done
          "$GODOT_BIN" --headless --path clients/godot --import
          timeout 90 "$GODOT_BIN" --headless --path clients/godot -- --smoke | tee smoke.log
          grep -q "SMOKE OK" smoke.log
      - name: Screenshots of each view (software OpenGL)
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 120 "$GODOT_BIN" --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path clients/godot -- --shots "$PWD/shots" | tee shots.log
          grep -q "SMOKE OK" shots.log
          ls shots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-views
          path: |
            shots/
            server.log
