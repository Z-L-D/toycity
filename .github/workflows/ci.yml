name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ToyCity.slnx -c Release
      - run: dotnet test ToyCity.slnx -c Release --no-build
      - name: Headless run (5 years)
        run: dotnet run --project tools/ToyCity.Bench -c Release --no-build -- 5
      - name: Agent tiers on this runner
        run: |
          dotnet run --project tools/ToyCity.Bench -c Release --no-build -- tiers --quick --out tiers-quick.json
          dotnet run --project tools/ToyCity.Bench -c Release --no-build -- tiers --out tiers-full.json
          { echo '### Agent tiers on this runner'; echo '```json'; cat tiers-quick.json; echo; cat tiers-full.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run build
