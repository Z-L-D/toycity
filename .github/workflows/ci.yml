name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ToyCity.slnx -c Release
      - run: dotnet test ToyCity.slnx -c Release --no-build --filter "Category!=Gate"
      - name: Region gate, the Beta 3 gate (three tiles on their own hosts, two human mayors and a computer, a decade)
        run: |
          dotnet test tests/ToyCity.ClientModel.Tests -c Release --no-build --filter "Category=Gate" --logger "console;verbosity=detailed" | tee region-gate.log
          { echo '### Region gate (Beta 3)'; echo; grep -o 'GATE .*' region-gate.log | sed 's/^GATE /- /'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "Passed!" region-gate.log
      - name: Headless run (5 years)
        run: dotnet run --project tools/ToyCity.Bench -c Release --no-build -- 5
      - name: Agent tiers on this runner
        run: |
          dotnet run --project tools/ToyCity.Bench -c Release --no-build -- tiers --quick --out tiers-quick.json
          dotnet run --project tools/ToyCity.Bench -c Release --no-build -- tiers --out tiers-full.json
          { echo '### Agent tiers on this runner'; echo '```json'; cat tiers-quick.json; echo; cat tiers-full.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run build

  godot:
    runs-on: ubuntu-latest
    env:
      GODOT: Godot_v4.7.2-stable_mono_linux_x86_64
      GODOT_SHA512: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download Godot 4.7.2 .NET and check it
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT_BIN=$RUNNER_TEMP/$GODOT/${GODOT/_x86_64/}.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build src/ToyCity.Server -c Release
      - run: dotnet build clients/godot
      - name: Smoke test against a live server
        run: |
          dotnet run --project src/ToyCity.Server -c Release --no-build > server.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:5180/health && break; sleep 1; done
          "$GODOT_BIN" --headless --path clients/godot --import
          timeout 90 "$GODOT_BIN" --headless --path clients/godot -- --smoke | tee smoke.log
          grep -q "SMOKE OK" smoke.log
      - name: Smoke test against a dedicated server, signing in
        run: |
          mkdir -p ded && echo '{ "name": "CI server", "join": "open" }' > ded/host.json
          ToyCity__SaveDir="$PWD/ded" dotnet run --project src/ToyCity.Server -c Release --no-build -- --dedicated --urls http://localhost:5181 > ded-server.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:5181/health && break; sleep 1; done
          timeout 90 "$GODOT_BIN" --headless --path clients/godot -- --smoke --server ws://localhost:5181/ws --user ci-player --password secret1 --new-account | tee ded-smoke.log
          grep -q "SMOKE OK" ded-smoke.log
          grep -q "ci-player signed in" ded-server.log
      - name: Screenshots of each view (software OpenGL)
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 120 "$GODOT_BIN" --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path clients/godot -- --shots "$PWD/shots" 2>&1 | tee shots.log
          grep -q "SMOKE OK" shots.log
          ! grep -n "SHADER ERROR" -A3 shots.log
          ls shots/*.png
      - name: Dense-city benchmark (software OpenGL, so times are not the target hardware's)
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 300 "$GODOT_BIN" --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path clients/godot -- --bench "$PWD/bench.json" --graphics High --shots "$PWD/shots" 2>&1 | tee bench.log
          grep -q "BENCH wrote" bench.log
          ! grep -n "SHADER ERROR" -A3 bench.log
          { echo '### Dense-city benchmark, High (CI runner, software OpenGL)'; echo '```'; grep '^BENCH' bench.log; echo '```'; echo '```json'; cat bench.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Dense-city benchmark on the Low preset
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 300 "$GODOT_BIN" --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path clients/godot -- --bench "$PWD/bench-low.json" --graphics Low 2>&1 | tee bench-low.log
          grep -q "BENCH wrote" bench-low.log
          ! grep -n "SHADER ERROR" -A3 bench-low.log
          { echo '### Dense-city benchmark, Low'; echo '```'; grep '^BENCH' bench-low.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate run, the Alpha 3 loop on the benchmark city (software OpenGL, so times are not the target hardware's)
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 900 "$GODOT_BIN" --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path clients/godot -- --gate "$PWD/gate.json" --graphics High --shots "$PWD/gate-shots" 2>&1 | tee gate.log
          { echo '### Gate run (CI runner, software OpenGL)'; echo; grep '^GATE ' gate.log | sed 's/^GATE //'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "GATE OK" gate.log
          ! grep -n "SHADER ERROR" -A3 gate.log
      - name: Together, the Beta 2 gate (four players on a dedicated server, software OpenGL)
        run: |
          mkdir -p together && echo '{ "name": "Together town", "join": "open" }' > together/host.json
          ToyCity__SaveDir="$PWD/together" dotnet run --project src/ToyCity.Server -c Release --no-build -- --dedicated --urls http://localhost:5182 > together-server.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:5182/health && break; sleep 1; done
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 600 "$GODOT_BIN" --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path clients/godot -- --together "$PWD/together.json" --server ws://localhost:5182/ws --user "Mayor May" --password secret1 --new-account \
            --graphics High --shots "$PWD/together-shots" 2>&1 | tee together.log
          { echo '### Together: the Beta 2 gate (CI runner, software OpenGL)'; echo; grep '^TOGETHER ' together.log | sed 's/^TOGETHER /- /'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "TOGETHER OK" together.log || { tail -40 together-server.log; false; }
          ! grep -n "SHADER ERROR" -A3 together.log
      - name: Contact sheets of the views (base64 JPEG, for reviewers who can't download artifacts)
        if: always()
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null
          if ls gate-shots/*.png > /dev/null 2>&1; then
            montage gate-shots/*.png -tile 4x -geometry 400x225+1+1 -quality 45 gate-sheet.jpg
            echo "::group::gate-sheet.jpg base64"; echo "GATE-SHEET-BEGIN"; base64 -w 0 gate-sheet.jpg; echo; echo "GATE-SHEET-END"; echo "::endgroup::"
          fi
          if ls together-shots/*.png > /dev/null 2>&1; then
            montage together-shots/*.png -tile 2x -geometry 800x450+2+2 -quality 55 together-sheet.jpg
            echo "::group::together-sheet.jpg base64"; echo "TOGETHER-SHEET-BEGIN"; base64 -w 0 together-sheet.jpg; echo; echo "TOGETHER-SHEET-END"; echo "::endgroup::"
          fi
          montage shots/*.png -tile 4x -geometry 320x180+1+1 -quality 45 sheet.jpg
          echo "::group::sheet.jpg base64"; echo "SHEET-BEGIN"; base64 -w 0 sheet.jpg; echo; echo "SHEET-END"; echo "::endgroup::"
          # The screens with the most UI at full size, so the panels can be read.
          for n in 0 9 10 11 12 13 14 15; do
            f=$(ls shots/view-$n-*.png 2>/dev/null | head -1)
            [ -n "$f" ] || continue
            convert "$f" -quality 70 "ui-$n.jpg"
            echo "::group::ui-$n.jpg base64"; echo "UI-SHOT-BEGIN $n"; base64 -w 0 "ui-$n.jpg"; echo; echo "UI-SHOT-END"; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-views
          path: |
            shots/
            sheet.jpg
            bench.json
            bench-low.json
            gate-shots/
            gate-sheet.jpg
            gate.json
            gate.log
            together-shots/
            together-sheet.jpg
            together.json
            together.log
            together-server.log
            server.log
